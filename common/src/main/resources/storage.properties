# Object storage (S3-compatible) for product-listing images.
# Committed dev defaults — point at the docker-compose MinIO. Credentials come from the
# S3_ACCESS_KEY / S3_SECRET_KEY env vars (dev fallback: minioadmin/minioadmin).
#
# storage.endpoint must be the host the BROWSER uses, because a presigned URL's signature is
# bound to its host. In dev both the backend and the browser reach MinIO at the host port the
# docker-compose `minio` service publishes (9100; 9000 is commonly taken on dev machines).
storage.endpoint=http://localhost:9100
storage.region=us-east-1
storage.bucket=catalog-images
storage.path-style-access=true
# Presigned URL lifetime, seconds.
storage.presign-ttl-seconds=900
