# SMTP (JavaMail) for transactional email — see docs/notifications-plan.md §6 (Phase 2).
#
# Committed dev defaults — NON-SECRET connection config only, mirroring storage.properties.
# The SMTP username and the Gmail App Password are secrets and are read from env vars:
#   SMTP_USERNAME  — the sending account (e.g. falcon.turbo.ai@gmail.com)
#   SMTP_PASSWORD  — the Gmail App Password (2FA app password, NOT the account password)
# Dev values live in the gitignored .env.local; the app has no dotenv loader, so source it first:
#   set -a; source .env.local; set +a
# NEVER put the App Password in this file — it is committed.
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
# Optional From/envelope address shown to recipients; falls back to SMTP_USERNAME when blank.
mail.from=
