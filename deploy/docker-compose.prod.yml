# Production stack for the inventory backend — lives on the VPS at /opt/ststore.
#
# Self-contained: your own Caddy owns 80/443 and is the single edge proxy, routing api.<domain> and
# files.<domain> to this stack. See deploy/Caddyfile.
#
# Config/secrets come from a sibling `.env` (copy from env.prod.example; never commit it). Compose
# auto-loads it from the working dir and interpolates ${VARS} below.
#
# First boot (make sure 80/443 are free — stop any other proxy on the box first):
#   docker compose -f docker-compose.prod.yml up -d
# The CI deploy job then only refreshes the backend.

# Pinned so `com.docker.compose.project` labels are deterministic (Dozzle filters on this) rather
# than derived from the launch directory. /opt/ststore already yields this name — a no-op today,
# but it guarantees the DOZZLE_FILTER match survives a rename/relocation of the deploy dir.
name: ststore

networks:
  internal:
    driver: bridge

services:
  db:
    # PINNED to 17: the VPS data volume was initialised by Postgres 17, and a major-version
    # image bump does NOT migrate it — the container crashloops ("database files are
    # incompatible with server"). Moving to 18+ is a deliberate pg_upgrade/dump-restore
    # operation, never a dependency bump. Dependabot majors are ignored for this image.
    image: postgres:17-alpine
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    networks: [internal]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    networks: [internal]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: create the catalog-images bucket (private — objects served via presigned GET), then exit.
  minio-init:
    image: minio/mc:latest
    networks: [internal]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/catalog-images &&
      mc anonymous set none local/catalog-images;
      exit 0;
      "

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/mohmdloai/inventory-api:latest}
    restart: unless-stopped
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}?currentSchema=inventorydb
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MINIO_PUBLIC_ENDPOINT: https://files.${DOMAIN}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      CORS_ALLOWED_ORIGINS: https://admin.${DOMAIN},https://store.${DOMAIN}
      # Customer links (order view / unsubscribe) → the storefront.
      PUBLIC_BASE_URL: https://store.${DOMAIN}
      # This server's own public origin — minted into every Paymob intention's notification_url so
      # the card webhook (POST /api/psp/paymob/{orgId}/webhook) can find its way back (V99).
      PUBLIC_API_URL: https://api.${DOMAIN}
      # Credential links (reset / activate / verify-email) → the ADMIN app, where those pages
      # live (story 89 — without this they 404 on the storefront).
      ADMIN_BASE_URL: https://admin.${DOMAIN}
      JWT_SECRET: ${JWT_SECRET}
      CUSTOMER_JWT_SECRET: ${CUSTOMER_JWT_SECRET}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Web Push (V96). Both keys unset → the channel is honestly off (LoggingWebPushSender,
      # GET /api/me/push/config → enabled:false, the admin switch reads "unavailable").
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-mailto:ops@${DOMAIN}}
      # Paymob card (V98/V99). Unset → connect refuses (409) and no merchant can take card; nothing
      # else changes. Never rotate casually: every stored merchant credential is sealed under it.
      PAYMOB_CREDENTIAL_KEY: ${PAYMOB_CREDENTIAL_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Frontend (built + published by the frontst repo's CI) ──────────────────
  admin:
    image: ${ADMIN_IMAGE:-ghcr.io/mohmdloai/admin:latest}
    restart: unless-stopped
    networks: [internal]
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Same-origin /api proxy → internal backend (keeps staff auth cookies first-party to admin.<domain>).
      BACKEND_API_URL: http://backend:8080

  storefront:
    image: ${STOREFRONT_IMAGE:-ghcr.io/mohmdloai/storefront:latest}
    restart: unless-stopped
    networks: [internal]
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: "3000"
      BACKEND_API_URL: http://backend:8080
      # NEXT_PUBLIC_STOREFRONT_ORIGIN is baked at build time (frontst CI), not read here.

  # The marketing site (frontst story 54) — the platform's own front door at the apex yabta3.com.
  # Fully static SSG: no backend, no /api proxy, no depends_on backend — a backend outage can't take
  # it down. Only PORT is read at runtime.
  marketing:
    image: ${MARKETING_IMAGE:-ghcr.io/mohmdloai/marketing:latest}
    restart: unless-stopped
    networks: [internal]
    environment:
      NODE_ENV: production
      PORT: "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    networks: [internal]
    depends_on:
      - backend
      - admin
      - storefront
      - marketing
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    # Lets server-local site blocks (caddy.d) reach host-published container ports.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Server-local, repo-free site blocks (imported by the Caddyfile). Create dir on the VPS.
      - ./caddy.d:/etc/caddy/conf.d:ro
      - caddy_data:/data
      - caddy_config:/config

  # ── Log viewer (private, SSH-tunnel only) — see docs/dozzle-log-viewer-plan.md ──
  # Live container logs for this stack. NOT public: no networks, no Caddy route, no DNS.
  # Reached only over the SSH tunnel we already use (protection = the SSH key).
  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    # Loopback-only publish → reachable from the VPS itself, never from the internet.
    # Host port 8899 avoids the 8080 the neighbouring proxy on this shared box already binds.
    ports:
      - "127.0.0.1:8899:8080"
    environment:
      # Only this stack's containers — not the whole host (keeps the neighbour app private).
      # Matches the pinned compose project name below; do not remove on this shared host.
      DOZZLE_FILTER: "label=com.docker.compose.project=ststore"
    volumes:
      # Read-only socket — Dozzle only needs to read logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
