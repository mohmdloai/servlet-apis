<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="headerOld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <linearGradient id="headerNew" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="headerGeneric" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- ════════════════════  BACKGROUND  ════════════════════ -->
  <rect width="920" height="620" rx="16" fill="#f8fafc"/>

  <!-- ════════════════════  TITLE  ════════════════════ -->
  <text x="460" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">
    Paging Refactor — Before &amp; After
  </text>

  <!-- ───────────── BEFORE (left) ───────────── -->
  <rect x="20" y="56" width="420" height="540" rx="12" fill="#fff5f5" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="230" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">BEFORE — duplicated inner classes</text>

  <!-- ProductResponse box -->
  <rect x="50" y="100" width="360" height="200" rx="8" fill="#fff" stroke="#e5e7eb" filter="url(#shadow)"/>
  <rect x="50" y="100" width="360" height="32" rx="8" fill="url(#headerOld)"/>
  <rect x="50" y="124" width="360" height="8" fill="url(#headerOld)"/>
  <text x="230" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">ProductResponse.java</text>

  <text x="70" y="155" font-size="12" fill="#334155">id, name, description, basePrice,</text>
  <text x="70" y="172" font-size="12" fill="#334155">sku, createdAt, updatedAt</text>

  <!-- Inner Page class (strikethrough) -->
  <rect x="70" y="190" width="320" height="96" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-dasharray="5,3"/>
  <text x="230" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">static class Page</text>
  <text x="230" y="230" text-anchor="middle" font-size="11" fill="#991b1b">List&lt;ProductResponse&gt; data</text>
  <text x="230" y="248" text-anchor="middle" font-size="11" fill="#991b1b">long total, int page, int size</text>
  <line x1="100" y1="230" x2="360" y2="230" stroke="#dc2626" stroke-width="1.5"/>
  <text x="230" y="274" text-anchor="middle" font-size="18" fill="#dc2626">&#x2716; REMOVED</text>

  <!-- CustomerResponse box -->
  <rect x="50" y="320" width="360" height="200" rx="8" fill="#fff" stroke="#e5e7eb" filter="url(#shadow)"/>
  <rect x="50" y="320" width="360" height="32" rx="8" fill="url(#headerOld)"/>
  <rect x="50" y="344" width="360" height="8" fill="url(#headerOld)"/>
  <text x="230" y="341" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">CustomerResponse.java</text>

  <text x="70" y="375" font-size="12" fill="#334155">id, email, createdAt, updatedAt</text>

  <!-- Inner Page class (strikethrough) -->
  <rect x="70" y="395" width="320" height="96" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-dasharray="5,3"/>
  <text x="230" y="417" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">static class Page</text>
  <text x="230" y="435" text-anchor="middle" font-size="11" fill="#991b1b">List&lt;CustomerResponse&gt; data</text>
  <text x="230" y="453" text-anchor="middle" font-size="11" fill="#991b1b">long total, int page, int size</text>
  <line x1="100" y1="435" x2="360" y2="435" stroke="#dc2626" stroke-width="1.5"/>
  <text x="230" y="479" text-anchor="middle" font-size="18" fill="#dc2626">&#x2716; REMOVED</text>

  <!-- ───────────── AFTER (right) ───────────── -->
  <rect x="480" y="56" width="420" height="540" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="690" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">AFTER — single generic class</text>

  <!-- PageResponse<T> (the new shared class) -->
  <rect x="530" y="100" width="320" height="152" rx="8" fill="#fff" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <rect x="530" y="100" width="320" height="32" rx="8" fill="url(#headerGeneric)"/>
  <rect x="530" y="124" width="320" height="8" fill="url(#headerGeneric)"/>
  <text x="690" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a5f">PageResponse&lt;T&gt;</text>
  <text x="690" y="155" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">NEW — shared by all entities</text>
  <text x="560" y="180" font-size="12" fill="#334155">List&lt;T&gt; data</text>
  <text x="560" y="198" font-size="12" fill="#334155">long total</text>
  <text x="560" y="216" font-size="12" fill="#334155">int page, int size</text>
  <text x="560" y="240" font-size="11" font-style="italic" fill="#64748b">&#x2714; One definition, any entity type</text>

  <!-- ProductServlet -->
  <rect x="510" y="300" width="170" height="100" rx="8" fill="#fff" stroke="#e5e7eb" filter="url(#shadow)"/>
  <rect x="510" y="300" width="170" height="28" rx="8" fill="url(#headerNew)"/>
  <rect x="510" y="322" width="170" height="6" fill="url(#headerNew)"/>
  <text x="595" y="319" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">ProductServlet</text>
  <text x="520" y="348" font-size="10" fill="#334155">new PageResponse&lt;&gt;(</text>
  <text x="530" y="362" font-size="10" fill="#334155">data, total,</text>
  <text x="530" y="376" font-size="10" fill="#334155">page, size)</text>
  <text x="520" y="393" font-size="10" font-style="italic" fill="#16a34a">&#x2714; uses generic</text>

  <!-- CustomerServlet -->
  <rect x="700" y="300" width="170" height="100" rx="8" fill="#fff" stroke="#e5e7eb" filter="url(#shadow)"/>
  <rect x="700" y="300" width="170" height="28" rx="8" fill="url(#headerNew)"/>
  <rect x="700" y="322" width="170" height="6" fill="url(#headerNew)"/>
  <text x="785" y="319" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">CustomerServlet</text>
  <text x="710" y="348" font-size="10" fill="#334155">new PageResponse&lt;&gt;(</text>
  <text x="720" y="362" font-size="10" fill="#334155">items, total,</text>
  <text x="720" y="376" font-size="10" fill="#334155">page, size)</text>
  <text x="710" y="393" font-size="10" font-style="italic" fill="#16a34a">&#x2714; uses generic</text>

  <!-- Arrows from servlets to PageResponse -->
  <line x1="595" y1="300" x2="650" y2="252" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="785" y1="300" x2="730" y2="252" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- JSON output box -->
  <rect x="530" y="440" width="320" height="136" rx="8" fill="#fff" stroke="#e5e7eb" filter="url(#shadow)"/>
  <rect x="530" y="440" width="320" height="28" rx="8" fill="#fef3c7"/>
  <rect x="530" y="462" width="320" height="6" fill="#fef3c7"/>
  <text x="690" y="459" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">JSON Output — Unchanged</text>
  <text x="550" y="488" font-size="11" font-family="monospace" fill="#334155">{</text>
  <text x="560" y="504" font-size="11" font-family="monospace" fill="#334155">"data": [ { ... }, { ... } ],</text>
  <text x="560" y="520" font-size="11" font-family="monospace" fill="#334155">"total": 42,</text>
  <text x="560" y="536" font-size="11" font-family="monospace" fill="#334155">"page": 0,</text>
  <text x="560" y="552" font-size="11" font-family="monospace" fill="#334155">"size": 10</text>
  <text x="550" y="568" font-size="11" font-family="monospace" fill="#334155">}</text>

  <!-- Arrow from PageResponse to JSON -->
  <line x1="690" y1="252" x2="690" y2="430" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="700" y="370" font-size="10" fill="#64748b" font-style="italic">serializes to</text>

  <!-- Bottom note -->
  <text x="460" y="612" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">
    Zero API contract change — clients see the exact same JSON shape
  </text>
</svg>
