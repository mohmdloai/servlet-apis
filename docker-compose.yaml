services:
  db:
    image: postgres:17-alpine
    container_name: inventory_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Matches the default schema jOOQ codegen targets
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      # host:container — change host port if 5432 is already taken
      - "5433:5432"
    volumes:
      # Named volume persists data across container restarts
      - postgres_data:/var/lib/postgresql/data
      # Optional: place additional init .sql files here
      # - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventorydb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: inventory_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # S3-compatible object storage for product-listing images (presigned PUT/GET in dev).
  minio:
    image: minio/minio:latest
    container_name: inventory_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # Host 9000/9001 are often taken (php-fpm etc.) — map to 9100/9101.
      # storage.properties' endpoint must match the host-side API port.
      - "9100:9000"   # S3 API (also the browser-reachable presign host in dev)
      - "9101:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: create the catalog-images bucket, then exit. Keeps infra declarative.
  minio-init:
    image: minio/mc:latest
    container_name: inventory_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/catalog-images &&
      mc anonymous set none local/catalog-images;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:

